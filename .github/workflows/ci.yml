name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.js'
      - '**.py'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]

jobs:
  # Node.js Test Job
  node-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Node.js tests
      run: npm test

    - name: Generate test coverage report
      run: npm test -- --coverage

    - name: Upload coverage to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  # Python Test Job
  python-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python tests
      run: pytest -v --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  # Lint Job for Node.js
  node-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

  # Lint Job for Python
  python-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy

    - name: Run flake8
      run: |
        flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203

    - name: Run black check
      run: black --check src/ tests/

    - name: Run mypy type checking
      run: mypy src/ --ignore-missing-imports

  # Build and Deploy (for main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [node-test, python-test, node-lint, python-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build project
      run: |
        echo "Building project..."
        # Add your build commands here
        # For Node.js: npm run build
        # For Python: python -m py_compile src/main.py

    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add your deployment commands here
        # This could include deploying to:
        # - AWS S3
        # - GitHub Pages
        # - Heroku
        # - Vercel
        # - Netlify
        # - etc.
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  # Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: [node-test, python-test]
    if: failure()
    steps:
    - name: Send notification
      run: |
        echo "Tests failed! Sending notification..."
        # Add notification logic here (Slack, email, etc.)
